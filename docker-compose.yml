services:
  mongodb:
    image: mongo:7.0
    container_name: collab-code-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - collab-network

  redis:
    image: redis:7.2-alpine
    container_name: collab-code-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - collab-network
    command: redis-server --appendonly yes

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: collab-code-worker
    restart: always
    environment:
      REDIS_URL: ${REDIS_URL}
      MONGODB_URI: ${MONGODB_URI}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      - redis
      - mongodb
    networks:
      - collab-network
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: collab-code-server
    restart: always
    env_file:
      - ./.env
    ports:
      - "5000:5000"
    environment:
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      - redis
      - mongodb
    networks:
      - collab-network

volumes:
  mongodb_data:
  redis_data:

networks:
  collab-network:
    driver: bridge
