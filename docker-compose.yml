services:
  mongodb:
    image: mongo:7.0
    container_name: collab-code-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
    networks:
      - collab-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7.2-alpine
    container_name: collab-code-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - collab-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: collab-code-worker
    restart: always
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      MONGODB_URI: ${MONGODB_URI}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - collab-network
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: collab-code-server
    restart: always
    env_file:
      - ./.env
    ports:
      - "5000:5000"
    environment:
      PORT: ${PORT}
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - collab-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${CLIENT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: collab-code-client
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      server:
        condition: service_healthy
    networks:
      - collab-network

volumes:
  mongodb_data:
  redis_data:

networks:
  collab-network:
    driver: bridge
